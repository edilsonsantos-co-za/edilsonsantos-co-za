# workspace-managed-sha256: 4a2c9b66c34ff82b84c474988cd3743c79ec5e793cd9f4b4a87a95ec89cfd6bd
name: Workspace status

on:
    workflow_run:
        workflows: ["Workspace deploy", "Workspace formatting repair"]
        types: [completed]

permissions:
    contents: read # also lets the card list the commit's files

jobs:
    notify:
        if: github.event.workflow_run.name != 'Workspace status'
        runs-on: ubuntu-latest
        steps:
            - name: Notify configured Google Workspace channels
              env:
                  WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL != '' && secrets.GOOGLE_CHAT_WEBHOOK_URL || secrets.GOOGLE_CHAT_WEBHOOK }}
                  WEBHOOK_URLS: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URLS }}
                  LEGACY_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
                  RUN_NAME: ${{ github.event.workflow_run.name }}
                  RUN_STATUS: ${{ github.event.workflow_run.conclusion }}
                  RUN_URL: ${{ github.event.workflow_run.html_url }}
                  RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
                  RUN_SHA: ${{ github.event.workflow_run.head_sha }}
                  RUN_ACTOR: ${{ github.event.workflow_run.actor.login }}
                  GH_TOKEN: ${{ github.token }}
              run: |
                  python3 - <<'PY'
                  import json, os, random, time, urllib.error, urllib.request, urllib.parse
                  urls = json.loads(os.environ.get("WEBHOOK_URLS") or "[]")
                  if not isinstance(urls, list):
                      raise ValueError("GOOGLE_CHAT_WEBHOOK_URLS must be a JSON array")
                  if os.environ.get("WEBHOOK_URL"):
                      urls.append(os.environ["WEBHOOK_URL"])
                  if os.environ.get("LEGACY_WEBHOOK_URL") and os.environ.get("LEGACY_WEBHOOK_URL") != os.environ.get("WEBHOOK_URL"):
                      urls.append(os.environ["LEGACY_WEBHOOK_URL"])
                  urls = list(dict.fromkeys(urls))
                  if not urls:
                      print("::warning::No Google Chat channel configured: set GOOGLE_CHAT_WEBHOOK_URL(S)")
                      raise SystemExit(0)
                  repo, name = os.environ["GITHUB_REPOSITORY"], os.environ["RUN_NAME"]
                  status = (os.environ.get("RUN_STATUS") or "unknown").lower()
                  branch, sha, run_url = os.environ["RUN_BRANCH"], os.environ["RUN_SHA"], os.environ["RUN_URL"]
                  # What changed: the commit's author, message and files (first 15). Without a token, or if GitHub
                  # does not answer, the card is sent without them.
                  author = message = ""; files = []; more = 0
                  try:
                      req = urllib.request.Request(f"https://api.github.com/repos/{repo}/commits/{sha}", headers={
                          "Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json",
                          "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "workspace-status"})
                      with urllib.request.urlopen(req, timeout=20) as response:
                          commit = json.loads(response.read().decode())
                      author = commit["commit"]["author"]["name"]
                      message = commit["commit"]["message"].splitlines()[0]
                      changed = commit.get("files") or []
                      files = [f"{f.get('status', 'modified')}: {f['filename']}" for f in changed[:15]]
                      more = max(len(changed) - 15, 0)
                  except Exception:
                      pass
                  actor = os.environ.get("RUN_ACTOR", "")
                  details = [f"Message: {message}"] * bool(message) + [f"Author: {author}"] * bool(author) + [f"Triggered by: {actor}"] * bool(actor)
                  listing = [f"- {f}" for f in files] + [f"- ...and {more} more"] * bool(more)
                  text = "\n".join([f"{repo}: {name} {status.upper()}", f"{branch} @ {sha[:12]}", *details, run_url,
                                    "Files changed:", *(listing or ["- No file list available"])])
                  icon = {"success": "✅", "failure": "❌", "cancelled": "⏹️", "skipped": "⏭️"}.get(status, "⚠️")
                  esc = lambda v: str(v).replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")
                  card = {"cardsV2": [{"cardId": "run", "card": {
                      "header": {"title": f"{icon} {name}: {status}"[:200], "subtitle": repo[:200]},
                      "sections": [{"widgets": [
                          {"decoratedText": {"topLabel": "Branch", "text": esc(branch)}},
                          {"decoratedText": {"topLabel": "Commit", "text": esc(sha[:12] + (" " + message if message else "")), "wrapText": True}},
                          *([{"decoratedText": {"topLabel": "Author", "text": esc(author)}}] if author else []),
                          *([{"decoratedText": {"topLabel": "Triggered by", "text": esc(actor)}}] if actor else []),
                          {"textParagraph": {"text": "<b>Files changed</b><br>" + ("<br>".join(esc(f) for f in listing) or "No file list available")}},
                          {"buttonList": {"buttons": [
                              {"text": "Open run", "onClick": {"openLink": {"url": run_url}}},
                              {"text": "Commit", "onClick": {"openLink": {"url": f"https://github.com/{repo}/commit/{sha}"}}},
                          ]}},
                      ]}]}}]}
                  failed = 0
                  for url in urls:
                      parsed = urllib.parse.urlsplit(url)
                      if parsed.scheme != "https" or parsed.hostname != "chat.googleapis.com":
                          raise ValueError("Only Google Chat HTTPS webhooks are allowed")
                      # Card first; if Chat refuses it, the same facts as plain text. Chat limits how fast a space
                      # accepts messages, so a burst of runs (Dependabot) gets 429: wait and retry the card before
                      # falling back, and log why it fell back (status only; the URL is never printed).
                      sent = False
                      for kind, payload in (("card", card), ("text", {"text": text})):
                          for attempt in range(4):
                              req = urllib.request.Request(url, data=json.dumps(payload).encode(),
                                  headers={"Content-Type": "application/json; charset=UTF-8"}, method="POST")
                              try:
                                  with urllib.request.urlopen(req, timeout=20) as response:
                                      response.read()
                                  sent = True
                                  break
                              except urllib.error.HTTPError as error:
                                  reason = f"HTTP {error.code}"
                                  retry = error.code == 429 or error.code >= 500
                              except Exception as error:
                                  reason, retry = type(error).__name__, True
                              print(f"::warning::{kind} not accepted ({reason}), attempt {attempt + 1} of 4")
                              if not retry or attempt == 3:
                                  break
                              time.sleep(5 * (attempt + 1) + random.random() * 3)
                          if sent:
                              print(f"sent as {kind}")
                              break
                      if not sent:
                          failed += 1
                  if failed:
                      raise SystemExit(f"Failed to notify {failed} channel(s); webhook values are not logged")
                  print(f"Notified {len(urls)} channel(s)")
                  PY
